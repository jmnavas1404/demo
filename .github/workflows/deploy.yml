# Baut die JupyterLite-Seite bei jedem Push auf main und veroeffentlicht sie auf GitHub Pages.
# Einmalig im Repo einstellen: Settings -> Pages -> Source = "GitHub Actions".
name: Build and deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements.txt
      - name: Build the site (notebooks + CSV from ./content are bundled)
        run: jupyter lite build --contents content --output-dir dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
